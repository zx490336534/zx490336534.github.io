name: Verify blog

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Run regression tests
        run: uv run --with-requirements scripts/build_blog.py python -m unittest discover -s scripts -p 'test_*.py'
      - name: Rebuild the blog
        run: uv run scripts/build_blog.py
      - name: Verify generated pages
        run: uv run scripts/verify_blog_discovery.py
      - name: Verify blog and mobile interactions in Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/blog-checks" --no-audit --no-fund --no-save playwright-core@1.65.1
          export NODE_PATH="$RUNNER_TEMP/blog-checks/node_modules"
          base_url=http://127.0.0.1:8765
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/blog-checks-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --retry 5 --retry-connrefused "$base_url/" -o /dev/null
          node scripts/verify-reader-interactions.cjs "$base_url"
          node scripts/verify-video-series.cjs "$base_url"
          node scripts/verify-mobile-reading.cjs "$base_url"
          node scripts/verify-mobile-navigation.cjs "$base_url"
          node scripts/verify-mobile-drafts.cjs "$base_url"
          node scripts/verify-course-appearance.cjs "$base_url"
      - name: Check for unpublished generated changes
        run: |
          changes=$(git status --porcelain=v1 --untracked-files=all)
          if [[ -n "$changes" ]]; then
            printf '%s\n' "$changes"
            exit 1
          fi
