<!DOCTYPE html><html lang="zh-CN"><meta charset="utf-8"><title>本机虚构收藏清单</title>
<style>body{margin:0;background:#fbfaf3;color:#243348;font:19px/1.55 system-ui,sans-serif;padding:34px}h1{font-size:28px;margin:0}main{margin:30px 0;display:grid;grid-template-columns:1fr 1fr;gap:18px}section{background:white;border:1px solid #dbe2d9;padding:24px;border-radius:14px}h2{font-size:22px}button{font:inherit;border:0;padding:12px 20px;border-radius:9px;background:#136551;color:#fff}li{font-size:20px}small{color:#566b63}p{margin:13px 0}</style>
<h1>06 · 实际执行：重复收藏不增加副本</h1><small>本机虚构页面 · 只执行已选用例</small><main><section><h2>路线详情</h2><p id="route">湖边散步</p><button>收藏</button><p id="tally">实际点击：0 次</p></section><section><h2>收藏清单</h2><p>清单总数：<strong id="count">0</strong></p><ul id="entries"></ul></section></main><small>预期：连续收藏同一路线两次，清单仍只有一条。</small>
<script>let n=0;document.querySelector('button').onclick=()=>{document.querySelector('#tally').textContent='实际点击：'+(++n)+' 次';const list=document.querySelector('#entries');if(!list.children.length){const li=document.createElement('li');li.textContent='湖边散步';list.append(li);}document.querySelector('#count').textContent=list.children.length;document.querySelector('button').textContent='已收藏';};</script></html>
