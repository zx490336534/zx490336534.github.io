<!DOCTYPE html><html lang="zh-CN"><meta charset="utf-8"><title>Codex 对话复现与测试用例脑图</title>
<style>
*{box-sizing:border-box}body{margin:0;width:1440px;height:900px;overflow:hidden;background:#fff;color:#20262d;font:17px/1.55 system-ui,-apple-system,sans-serif}header{height:61px;display:grid;grid-template-columns:478px 1fr;background:#f8f9fa;border-bottom:1px solid #dce0e4;align-items:stretch}header section{display:flex;align-items:center;gap:12px;padding:0 15px}header section:first-child{border-right:1px solid #dce0e4}.lights{display:flex;gap:5px}.lights i{width:10px;height:10px;border-radius:50%;background:#efa464}.lights i:first-child{background:#ea7b78}.lights i:last-child{background:#86bb91}.tab{padding:6px 12px;border-radius:8px;background:#e9ecef;color:#2d3e50;font-weight:650}.disclosed{margin-left:auto;color:#586873;font-size:13px}main{height:811px;display:grid;grid-template-columns:478px 1fr}.left{border-right:1px solid #dce0e4;min-width:0;display:flex;flex-direction:column;background:white}.context{display:flex;justify-content:space-between;align-items:center;margin:19px 20px 12px;border-bottom:1px solid #e9eef1;padding:0 0 12px;color:#3b5364}.context small{font-size:14px}.turns{flex:1;overflow:hidden;margin:0;display:flex;flex-direction:column;justify-content:flex-end;gap:11px;padding:8px 21px 17px}.turn{display:flex;flex-direction:column;gap:7px}.msg{align-self:flex-end;max-width:93%;background:#f0f2f4;border-radius:13px 13px 4px 13px;padding:9px 13px;color:#202833;font-size:17px}.speaker{font-size:12px;color:#657688;margin-right:7px;font-weight:700}.reply{padding:6px 9px 10px;font-size:16px;color:#243347;max-width:98%}.reply p{margin:4px 0 0}.meta{color:#426b60;font-size:12px;font-weight:730}.prior{opacity:.75;border-bottom:1px solid #edf0f2;padding-bottom:5px}.prior .reply span:last-child{font-size:15px}.entry{margin:0 17px 17px;border:1px solid #dbe1e7;border-radius:17px;padding:12px 13px 9px;flex:none;background:white}.entry div:first-child{color:#7e8b96;font-size:15px}.entry div:last-child{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:#536371}.send{background:#273746;color:#fff;border-radius:50%;width:26px;height:26px;display:inline-block;text-align:center;line-height:26px}.right{padding:18px 16px;background:#eaf2ef}.panel{height:100%;border:1px solid #cddcd8;border-radius:13px;background:#fff;overflow:hidden}.panel-bar{color:#346254;background:#f3f8f5;padding:7px 12px;border-bottom:1px solid #e3f0e9;font-size:14px}iframe{height:calc(100% - 37px);width:100%;border:0;display:block}iframe[hidden]{display:none}footer{height:28px;padding:4px 18px;font-size:12px;color:#536673;border-top:1px solid #dbe4e6;background:#f6f8fa}
</style>
<header><section><span class="lights"><i></i><i></i><i></i></span><strong>Codex 聊天</strong><span class="disclosed">对话复现 · 非客户端实录</span></section><section><span class="tab">▣ 测试用例工作区</span><span class="disclosed">真实插件 · 本机隔离环境</span></section></header>
<main><section class="left"><div class="context"><strong>收藏清单 · 功能验收</strong><small id="chapter"></small></div><div class="turns" id="turns"></div><div class="entry"><div>继续在这条聊天里修改用例或安排执行…</div><div><span>＋　测试用例工作区</span><span class="send">↑</span></div></div></section><section class="right"><div class="panel"><div class="panel-bar" id="panel-title">真实插件 · 测试用例脑图</div><iframe title="测试用例脑图" id="board" sandbox="allow-scripts"></iframe><iframe title="本机虚构收藏清单" id="fixture" hidden></iframe></div></section></main>
<footer>虚构需求 · 聊天文字为固定复现，脑图、用例版本、执行和结果来自实际本机操作。</footer>
<script>
const history=[];const el=(tag,cls,txt)=>{const e=document.createElement(tag);e.className=cls;e.textContent=txt;return e;};
window.present=o=>{document.getElementById('chapter').textContent=o.chapter;
 if(history.at(-1)?.chapter===o.chapter)history[history.length-1]=o;else history.push(o);
 const box=document.getElementById('turns');box.replaceChildren();
 history.slice(-3).forEach((x,i,list)=>{const last=i===list.length-1;
  const turn=el('div','turn'+(last?'':' prior'),'');
  const user=el('div','msg','');user.append(el('span','speaker','你'),el('span','',x.question));turn.append(user);
  const reply=el('div','reply','');reply.append(el('span','meta','Codex 回复复现 · '+x.tool));
  const p=el('p','','');p.append(el('span','',last?x.result+'。'+x.detail:x.result+'。'));reply.append(p);
  turn.append(reply);box.append(turn);
 });
};
window.panel=showFixture=>{document.querySelector('#board').hidden=showFixture;document.querySelector('#fixture').hidden=!showFixture;document.querySelector('#panel-title').textContent=showFixture?'本机虚构收藏页 · 浏览器实际执行':'真实插件 · 测试用例脑图';};
</script></html>
