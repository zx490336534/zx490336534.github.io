<!DOCTYPE html><html lang="zh-CN"><meta charset="utf-8"><title>Codex 插件 · 本机复现</title>
<style>
*{box-sizing:border-box}body{margin:0;height:900px;overflow:hidden;background:#101c2b;color:#f9fafb;font:24px/1.5 system-ui,-apple-system,sans-serif}header{height:91px;padding:18px 36px;border-bottom:1px solid #35495e;display:flex;align-items:center;justify-content:space-between;background:#142235}h1,h2,p{margin:0}h1{font-size:31px;letter-spacing:.01em}header span{font-size:18px;color:#c3d0dc;padding:7px 15px;background:#25374b;border-radius:20px}main{height:745px;display:grid;grid-template-columns:418px 1fr;gap:20px;padding:22px 25px 0}.narrative{padding:19px 14px 8px}.badge{font-size:18px;color:#8de9cc;font-weight:700;letter-spacing:.12em}h2{font-size:34px;margin:10px 0 26px;line-height:1.2}.msg{background:#193149;border:1px solid #3d5a77;border-radius:16px;padding:20px;color:#fff;font-size:24px}.tool{margin-top:25px;padding:17px 19px;border-left:4px solid #78e4bb;border-radius:0 10px 10px 0;background:#192c3c;font-size:22px}.tool small,.label{display:block;color:#a4bbce;font-size:17px;margin-bottom:8px}.tool strong{display:block;color:#97efd0;margin-top:8px}.detail{font-size:18px;color:#cad8e5;margin-top:22px}.app{background:#f9fafb;position:relative;color:#142235;border-radius:14px;overflow:hidden;border:1px solid #a7bccd}.app div{padding:9px 15px;color:#172e45;background:#cee4ef;font-size:17px;font-weight:bold}iframe{height:calc(100% - 44px);width:100%;border:0;display:block}footer{font-size:15px;margin:14px 38px;color:#9fb4c8}
