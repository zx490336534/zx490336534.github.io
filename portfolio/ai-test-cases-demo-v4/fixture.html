<!DOCTYPE html><html lang="zh-CN"><meta charset="utf-8"><title>本机收藏清单</title>
<style>body{margin:0;background:#142335;color:#eff6ff;font:25px/1.55 system-ui,sans-serif}header{padding:34px 70px;background:#1c3048;border-bottom:1px solid #567794;display:flex;justify-content:space-between}header span{color:#98d9c8}main{margin:65px 100px;display:grid;grid-template-columns:1fr 1fr;gap:32px}section{background:#fcfbf3;color:#172737;padding:42px;border-radius:20px}h1{font-size:36px;margin:0}h2{font-size:32px;color:#244762}button{font:inherit;border:0;padding:13px 23px;border-radius:10px;background:#136551;color:#fff}li{font-size:30px;color:#244e42}footer{margin:0 100px;color:#a9c1d4}#count{font-weight:bold;color:#136551}#tally{color:#355871}h2,p{margin:0 0 18px}</style>
<header><h1>06 · 实际执行所选用例</h1><span>本机虚构页面 · 浏览器实测</span></header><main><section><h2>路线详情</h2><p>湖边散步</p><button>收藏</button><p id="tally">实际点击：0 次</p></section><section><h2>收藏清单</h2><p>清单总数：<span id="count">0</span></p><ul id="entries"></ul></section></main><footer>预期：连续收藏同一路线两次，清单仍只有一条。执行过程中没有访问外部系统。</footer>
<script>let n=0;document.querySelector('button').onclick=()=>{document.querySelector('#tally').textContent='实际点击：'+(++n)+' 次';const list=document.querySelector('#entries');if(!list.children.length){const li=document.createElement('li');li.textContent='湖边散步';list.append(li);}document.querySelector('#count').textContent=list.children.length;};</script></html>
